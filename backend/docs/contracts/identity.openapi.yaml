      "post": {
        "operationId": "identityLogin",
        "tags": [
          "Identity"
        ],
        "description": "Empresa definida no servidor. Email normalizado, conta ativa; falha pública genérica. JWT não é fonte de concessões.",
        "responses": {
          "200": {
            "description": "Sucesso",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Session"
                }
              }
            },
            "headers": {
              "Set-Cookie": {
                "description": "Refresh opaco rotativo: HttpOnly; SameSite=Lax; host-only (sem Domain); Path=/api/v1/identity; Secure obrigatório em HTTPS produção; validade limitada.",
                "schema": {
                  "type": "string"
                }
              }
            }
          },
          "400": {
            "description": "Entrada inválida",
            "content": {
              "application/problem+json": {
                "schema": {
                  "$ref": "#/components/schemas/Problem"
                }
              }
            }
          },
          "401": {
            "description": "Sessão/credencial inválida",
            "content": {
              "application/problem+json": {
                "schema": {
                  "$ref": "#/components/schemas/Problem"
                }
              }
            }
          },
          "403": {
            "description": "Acesso negado",
            "content": {
              "application/problem+json": {
                "schema": {
                  "$ref": "#/components/schemas/Problem"
                }
              }
            }
          },
          "409": {
            "description": "Conflito de estado",
            "content": {
              "application/problem+json": {
                "schema": {
                  "$ref": "#/components/schemas/Problem"
                }
              }
            }
          },
          "429": {
            "description": "Limite de solicitações",
            "content": {
              "application/problem+json": {
                "schema": {
                  "$ref": "#/components/schemas/Problem"
                }
              }
            }
          }
        },
        "security": [],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/LoginRequest"
              }
            }
          }
