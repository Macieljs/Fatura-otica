    "title": "Fatura Ótica Identity — contrato Sprint 01",
    "version": "0.1.0",
    "description": "DESIGN-FIRST: endpoints ainda não implementados. Empresa configurada por ambiente, URL única. Sem tenant em payload de login. Contrato deve convergir ao OpenAPI exportado da API antes de client TS. Segurança da aplicação inclui vínculo atual e filial além de bearer."
